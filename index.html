<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A playful, mock-official invitation. Local only: nothing you pick is sent anywhere.">
<title>The Scheduling Department</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;800&family=Caveat:wght@600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
/* Layout: one narrow comic-panel card on warm cream. Ink outlines, hard lavender shadows, peach highlights, faint doodles in the margins. Buttons press down like a game UI. */
:root {
  --bg: #FBF3E6;
  --card: #FFFCF6;
  --field: #FFF6E8;
  --ink: #2F2640;
  --muted: #655B74;
  --line: #2F2640;
  --accent: #7B69B8;
  --accent-hover: #6A58A6;
  --on-accent: #FFFFFF;
  --lav: #E8E1F6;
  --lav-strong: #D3C8EE;
  --sel-bg: #EDE6FA;
  --peach: #FFD9BE;
  --peach-soft: #FFEEDD;
  --hard: #D3C8EE;
  --doodle: #B9AADB;
  --g1: rgba(255, 221, 196, .75);
  --g2: rgba(220, 210, 244, .8);
  --f: "Plus Jakarta Sans", ui-rounded, system-ui, -apple-system, "Segoe UI", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --f-display: "Bricolage Grotesque", "Plus Jakarta Sans", ui-rounded, system-ui, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --f-hand: "Caveat", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Segoe Print", "Bradley Hand", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1527;
    --card: #241E38;
    --field: #2B2445;
    --ink: #F5F0FF;
    --muted: #C1B8DA;
    --line: #8E80C2;
    --accent: #B5A5F0;
    --accent-hover: #C8BCF7;
    --on-accent: #1A1527;
    --lav: #342B5E;
    --lav-strong: #4A3F80;
    --sel-bg: #382F66;
    --peach: #5C3E3B;
    --peach-soft: #2E2438;
    --hard: #100C1C;
    --doodle: #7E70B5;
    --g1: rgba(92, 62, 59, .5);
    --g2: rgba(58, 49, 102, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1527;
  --card: #241E38;
  --field: #2B2445;
  --ink: #F5F0FF;
  --muted: #C1B8DA;
  --line: #8E80C2;
  --accent: #B5A5F0;
  --accent-hover: #C8BCF7;
  --on-accent: #1A1527;
  --lav: #342B5E;
  --lav-strong: #4A3F80;
  --sel-bg: #382F66;
  --peach: #5C3E3B;
  --peach-soft: #2E2438;
  --hard: #100C1C;
  --doodle: #7E70B5;
  --g1: rgba(92, 62, 59, .5);
  --g2: rgba(58, 49, 102, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f);
  font-size: 16px;
  line-height: 1.5;
  padding-block: clamp(16px, 5vh, 56px) 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background:
    radial-gradient(50rem 32rem at 6% -6%, var(--g1), transparent 62%),
    radial-gradient(48rem 32rem at 104% 104%, var(--g2), transparent 62%);
}
.bg .doodle { position: absolute; opacity: .55; animation: float var(--d, 8s) ease-in-out infinite; animation-delay: var(--dl, 0s); }
.doodle { fill: none; stroke: var(--doodle); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); } 50% { transform: translateY(-7px) rotate(var(--r, 0deg)); } }

.page { position: relative; z-index: 1; max-width: 34rem; margin: 0 auto; }
.card {
  position: relative; background: var(--card);
  border: 2.5px solid var(--line); border-radius: 26px; box-shadow: 6px 6px 0 var(--hard);
  padding: 22px 18px 26px; overflow-x: clip; /* the stamp animation starts oversized; keep it from widening the page */
}
@media (min-width: 560px) { .card { padding: 30px 34px 34px; } }

.brandrow {
  display: flex; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap;
  padding-bottom: 14px; margin-bottom: 20px; border-bottom: 2px dashed var(--lav-strong);
  font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}

.eyebrow { font-size: .74rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h1, h2 { margin: 10px 0 0; font-family: var(--f-display); font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
h1 { font-size: clamp(1.95rem, 7.6vw, 2.55rem); line-height: 1.05; }
h2 { font-size: clamp(1.6rem, 6.4vw, 2.05rem); line-height: 1.1; }
h1.h2 { font-size: clamp(1.6rem, 6.4vw, 2.05rem); line-height: 1.1; } /* round screens: still the page's h1, styled like the old h2 */
h1:focus, h2:focus { outline: none; }
.sub { margin: 10px 0 0; color: var(--muted); }
.question { margin: 18px 0 0; font-family: var(--f-display); font-size: clamp(1.35rem, 5.6vw, 1.75rem); font-weight: 800; line-height: 1.2; text-wrap: balance; }
.fine { margin: 14px 0 0; font-family: var(--f-hand); font-size: 1.15rem; line-height: 1.25; color: var(--muted); }

/* illustration */
.panel {
  position: relative; margin-top: 14px; overflow: hidden;
  border: 2.5px solid var(--line); border-radius: 22px; box-shadow: 4px 4px 0 var(--hard);
  background: linear-gradient(180deg, var(--peach-soft), var(--card));
}
.scene { display: block; width: 100%; height: auto; }
.scene .k { stroke: var(--line); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.scene .l { fill: none; stroke: var(--line); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.scene .e { fill: #FFFFFF; stroke: var(--line); stroke-width: 2.4; }
.scene .pp { fill: #2B2233; }
.scene .b { fill: none; stroke: #3A2B3D; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.scene .steam { animation: steam 3s ease-in-out infinite; }
.scene .drop { animation: steam 2.4s ease-in-out infinite; }
@keyframes steam { 0%, 100% { opacity: .55; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
.speech {
  position: absolute; left: 3%; top: 5%; width: min(76%, 21rem); margin: 0;
  padding: .7rem .95rem; border: 2.5px solid var(--line); border-radius: 20px;
  background: var(--card); color: var(--ink); box-shadow: 3px 3px 0 var(--lav-strong);
  font-weight: 800; font-size: clamp(.95rem, 3.9vw, 1.15rem); line-height: 1.25; text-wrap: balance;
  animation: pop .45s .15s cubic-bezier(.3, 1.5, .5, 1) backwards;
}
.speech .tail {
  position: absolute; left: 26%; bottom: -12px; width: 20px; height: 20px;
  background: var(--card); border-right: 2.5px solid var(--line); border-bottom: 2.5px solid var(--line);
  transform: rotate(45deg); border-bottom-right-radius: 4px;
}

/* buttons */
.btn {
  appearance: none; font: inherit; font-weight: 800; font-size: 1rem; cursor: pointer; color: var(--ink);
  min-height: 3.25rem; padding: 0 1.5rem; border-radius: 999px; border: 2px solid var(--line);
  background: var(--card); box-shadow: 0 4px 0 var(--line);
  transition: transform .12s ease, box-shadow .12s ease, background .2s ease;
  touch-action: manipulation;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: 0 2px 0 var(--line); }
.yes, .primary { background: var(--accent); color: var(--on-accent); }
.yes:hover:not(:disabled), .primary:hover:not(:disabled) { background: var(--accent-hover); }
.yes { position: relative; z-index: 3; min-height: 3.5rem; font-size: 1.1rem; padding: 0 2.2rem; }
.no { background: var(--peach-soft); }
.no:hover { background: var(--peach); }
.ghost { background: transparent; color: var(--muted); box-shadow: none; border-style: dashed; }
.ghost:hover { background: var(--lav); color: var(--ink); }
.ghost:active:not(:disabled) { transform: none; box-shadow: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* the escaping button lives in an arena it can roam */
.arena { position: relative; min-height: 20rem; margin-top: 20px; }
@media (min-width: 560px) { .arena { min-height: 14.5rem; } }
.row { display: flex; gap: 14px; justify-content: center; align-items: center; flex-direction: column; }
.row .yes { width: 100%; }
.slot { display: block; }
@media (min-width: 560px) {
  .row { flex-direction: row; }
  .row .yes { width: auto; }
}
.no.free { position: absolute; left: 0; top: 0; margin: 0; z-index: 2; transition: transform .3s cubic-bezier(.2, .9, .3, 1), background .2s; }
.nudge { position: absolute; left: 0; right: 0; bottom: 0; height: 5.25rem; display: flex; align-items: flex-end; justify-content: center; text-align: center; pointer-events: none; }
.bubble {
  display: inline-block; max-width: 100%; padding: .55rem .95rem; border: 2px solid var(--line); border-radius: 16px;
  background: var(--lav); color: var(--ink); font-size: .88rem; font-weight: 700; line-height: 1.35; text-wrap: balance;
  animation: pop .28s cubic-bezier(.3, 1.5, .5, 1);
}
@keyframes pop { from { opacity: 0; transform: scale(.85) translateY(6px); } }

/* status + bravery meter */
.status {
  display: inline-block; margin-top: 20px; padding: .4rem .85rem; border: 2px solid var(--line); border-radius: 12px;
  background: var(--peach); box-shadow: 2px 2px 0 var(--line);
  font-size: .78rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
}
.bravery { display: flex; gap: 4px; margin-top: 14px; max-width: 16rem; }
.bravery i { flex: 1; height: 12px; border: 2px solid var(--line); border-radius: 4px; background: var(--field); }
.bravery i.on { background: var(--accent); }

/* scheduling */
.steps { display: flex; gap: 6px; margin: 0 0 16px; }
.steps i { flex: 1; height: 8px; border: 2px solid var(--line); border-radius: 99px; background: var(--field); }
.steps i.done { background: var(--lav-strong); }
.steps i.now { background: var(--accent); }

.options { display: grid; gap: 12px; margin-top: 20px; }
.opt {
  appearance: none; display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center;
  width: 100%; min-height: 4.25rem; padding: 12px 14px; text-align: left;
  font: inherit; color: inherit; background: var(--card); cursor: pointer;
  border: 2px solid var(--line); border-radius: 18px; box-shadow: 0 4px 0 var(--line);
  transition: transform .12s ease, box-shadow .12s ease, background .2s ease;
  touch-action: manipulation;
}
.opt:hover { background: var(--field); }
.opt[aria-checked="true"] { background: var(--sel-bg); transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.opt .te { font-size: 1.3em; line-height: 1; vertical-align: -.08em; }
.opt .t { display: block; font-weight: 800; line-height: 1.25; }
.opt .d { display: block; margin-top: 2px; font-size: .88rem; color: var(--muted); line-height: 1.4; }
.opt .tick { display: grid; place-items: center; width: 1.65rem; height: 1.65rem; border-radius: 50%; border: 2px solid var(--line); color: transparent; font-size: .9rem; font-weight: 800; }
.opt[aria-checked="true"] .tick { background: var(--accent); color: var(--on-accent); }

.field-label { display: block; margin: 18px 0 6px; font-size: .74rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.field {
  width: 100%; font: inherit; font-size: 1rem; color: var(--ink); background: var(--field);
  border: 2px solid var(--line); border-radius: 16px; padding: 13px 15px;
}
.field::placeholder { color: var(--muted); opacity: .9; }
.field:focus { box-shadow: 0 0 0 4px var(--lav-strong); }
textarea.field { min-height: 9rem; resize: vertical; line-height: 1.5; margin-top: 8px; }
.hint { margin: 8px 0 0; font-size: .85rem; color: var(--muted); }

.summary { margin-top: 22px; padding: 16px 16px 18px; border: 2px solid var(--line); border-radius: 18px; background: var(--peach-soft); box-shadow: 3px 3px 0 var(--hard); }
.summary h2 { margin: 0 0 10px; font-family: var(--f-display); font-size: 1.1rem; font-weight: 800; line-height: inherit; letter-spacing: normal; text-wrap: wrap; }
.summary dl { margin: 0; display: grid; gap: 12px; }
.summary dt { font-size: .68rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.summary dd { margin: 1px 0 0; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; overflow-wrap: anywhere; }
.summary dd > span { min-width: 0; }
.summary .quote { display: block; padding-left: 12px; border-left: 3px solid var(--accent); font-weight: 500; white-space: pre-wrap; }
.link { appearance: none; flex: none; background: none; border: 0; padding: .3rem .4rem; font: inherit; font-size: .82rem; font-weight: 700; color: var(--accent); text-decoration: underline; cursor: pointer; position: relative; }
.link::after { content: ""; position: absolute; inset: -9px -6px; }

.actions { display: flex; gap: 12px; margin-top: 26px; justify-content: space-between; flex-direction: column-reverse; }
.actions .btn { width: 100%; }
@media (min-width: 560px) {
  .actions { flex-direction: row; }
  .actions .btn { width: auto; }
}
.actions.single { justify-content: flex-start; flex-direction: column; }
@media (min-width: 560px) { .actions.single { flex-direction: row; } .actions.single .btn { width: auto; } }

.stamp {
  display: inline-block; margin-top: 18px; padding: .4rem .85rem; border: 2px dashed var(--accent); border-radius: 12px;
  background: var(--card); color: var(--accent); font-size: .78rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  transform: rotate(-4deg); animation: slam .5s .35s cubic-bezier(.3, 1.6, .5, 1) backwards;
}
@keyframes slam { from { opacity: 0; transform: rotate(6deg) scale(1.8); } }
.signoff { margin: 24px 0 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(1.5rem, 6vw, 1.9rem); line-height: 1.15; text-wrap: balance; }
.hi { background: linear-gradient(transparent 58%, var(--peach) 58%); padding: 0 .1em; }
.terms { margin: 16px 0 0; text-align: center; font-family: var(--f-hand); font-size: 1.1rem; color: var(--muted); }

.screen.enter { animation: screenIn .4s ease-out; }
@keyframes screenIn { from { opacity: 0; transform: translateY(12px); } }

.burst { position: fixed; inset: 0; z-index: 60; pointer-events: none; overflow: hidden; }
.burst span { position: absolute; line-height: 1; animation: burst 1s cubic-bezier(.2, .8, .3, 1) forwards; }
@keyframes burst {
  from { transform: translate(0, 0) rotate(0) scale(.4); opacity: 1; }
  to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(1); opacity: 0; }
}

/* Fit-to-screen: keep the key part of the invitation (illustration, question, Accept, Escape) in view without scrolling.
   Spacing only; the wording and the Escape button's arena are unchanged. */
body { padding-block-start: clamp(10px, 2.2vh, 40px); }
.card { padding-top: 16px; }
@media (min-width: 560px) { .card { padding-top: 24px; } }
.brandrow { padding-bottom: 10px; margin-bottom: 12px; }
.panel { margin-top: 10px; margin-inline: auto; max-width: calc(clamp(9.5rem, 27svh, 15rem) * 1.4); container-type: inline-size; }
.speech { font-size: clamp(.78rem, 5.6cqw, 1.15rem); }
@media (min-width: 560px) { .panel { max-width: calc(clamp(9.5rem, 31svh, 16rem) * 1.4); } }
.panel { margin-bottom: 4px; }
/* phones: smaller text and buttons so the whole first view fits (the Escape arena itself is unchanged) */
@media (max-width: 559px) {
  h1 { font-size: clamp(1.45rem, 6.6vw, 1.9rem); line-height: 1.08; }
  .sub { font-size: .9rem; line-height: 1.4; }
  .question { margin-top: 10px; font-size: clamp(1.15rem, 5vw, 1.4rem); }
  .eyebrow { font-size: .68rem; }
  .brandrow { font-size: .62rem; padding-bottom: 8px; margin-bottom: 10px; }
  .btn { min-height: 2.75rem; }
  .yes { min-height: 2.9rem; font-size: 1.05rem; }
  .row { gap: 10px; }
  .arena { margin-top: 10px; }
  /* the invitation screen fills exactly one phone screen: no scrolling, Accept, Escape and its message always in view */
  body[data-screen="invite"] { padding-block: 10px; }
  body[data-screen="invite"] .card { display: flex; flex-direction: column; min-height: calc(100svh - 36px); padding-bottom: 14px; }
  body[data-screen="invite"] .screen { flex: 1; display: flex; flex-direction: column; }
  body[data-screen="invite"] .arena { flex: 1 1 auto; min-height: 13.5rem; }
  body[data-screen="invite"] .nudge { height: 3.5rem; }
  body[data-screen="invite"] .speech { width: min(94%, 21rem); font-size: clamp(.72rem, 5cqw, 1.05rem); padding: .4rem .7rem; }
  body[data-screen="invite"] .panel { width: 100%; max-width: calc(clamp(4rem, 100svh - 34.5rem, 13.5rem) * 1.4); }
  /* shorter phones: drop the small label above the illustration instead of squashing the illustration */
  @media (max-height: 680px) {
    body[data-screen="invite"] .eyebrow { display: none; }
    body[data-screen="invite"] .panel { max-width: calc(clamp(5.5rem, 100svh - 33.3rem, 13.5rem) * 1.4); }
  }
}
.sub { margin-top: 6px; }
.question { margin-top: 12px; }
.arena { margin-top: 12px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="d-star" viewBox="0 0 24 24"><path d="M12 3c.8 4.4 2.6 6.2 7 7-4.4.8-6.2 2.6-7 7-.8-4.4-2.6-6.2-7-7 4.4-.8 6.2-2.6 7-7z"/></symbol>
    <symbol id="d-cup" viewBox="0 0 24 24"><path d="M4.5 9h11v4.5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V9z"/><path d="M15.5 10.5h1.2a2.4 2.4 0 0 1 0 4.8h-1.2"/><path d="M8 3.5c-1 1.2 1 2 0 3.3M12 3.5c-1 1.2 1 2 0 3.3"/></symbol>
    <symbol id="d-warn" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4.5M12 17.2v.3"/></symbol>
  </defs>
</svg>

<div class="bg" id="bg" aria-hidden="true"></div>
<main class="page">
  <article class="card" id="card">
    <div class="brandrow"><span>Your Daily Roasting Appointment</span></div>
    <div id="screen" class="screen"></div>
  </article>
</main>

<script>
(function () {
  'use strict';

  /*
   * NOTE: this page has NO backend. "Submit my fate" only switches to the local
   * confirmation screen and fires a 'proposal:submit' DOM event. Nothing is sent,
   * stored or emailed anywhere. The answers live in `state` (see window.invitation),
   * so a real submit (form post, fetch, mail link...) can be wired to that event later.
   * Until then she has to screenshot the last screen or tell the sender in person.
   */

  /* ---------- content ---------- */
  var TIMES = [
    { id: 'noon', emoji: '☀️', title: 'Noon — daylight mischief', desc: 'Plenty of daylight for her to make fun of me. 😎' },
    { id: 'afternoon', emoji: '☕', title: 'Afternoon — coffee & criticism', desc: 'Caffeine first. Roasting me second. 😂' },
    { id: 'evening', emoji: '🌙', title: 'Evening — advanced mischief', desc: "Evening mischief? 🥶 I'll probably be freezing, but apparently that's a risk I'm willing to take for you. 😌😂" },
    { id: 'flex', emoji: '🕰️', title: 'Custom time — negotiate with the menace', desc: "Suggest your preferred time. I'll see if I can survive the proposed schedule. 📝" }
  ];
  var ACTIVITIES = [
    { id: 'walk', emoji: '🚶', title: 'A walk', desc: 'Fresh air, nice scenery, and fresh opportunities for you to roast me. 😂' },
    { id: 'coffee', emoji: '☕', title: 'Coffee', desc: 'A peaceful beverage. A deeply unpeaceful conversation. ☕😏' },
    { id: 'both', emoji: '☕🚶', title: 'Coffee + a walk', desc: 'The deluxe package: caffeine, fresh air, and extended opportunities to make fun of me. ✨' },
    { id: 'surprise', emoji: '🎲', title: 'Surprise me', desc: 'I trust your judgement. This could be my first mistake. 💀' }
  ];
  var NUDGES = [
    'The No button appears to be experiencing commitment issues. 😭',
    'Interesting. No has decided to relocate. 🏃',
    'Error 404: No energy found. 💀',
    'The scheduling department has lost control. 📉',
    'This button needs to get its life together. 😂',
    'Nice try. The committee saw that coming. 👀',
    'We regret to inform you that No is currently unavailable. 🚫',
    'Still trying? 😭',
    'The Escape button has requested a lawyer. ⚖️',
    'Plot twist: the button is faster than you. 💨',
    'HR has been notified. HR is also confused. 📎',
    'Impressive commitment to a lost cause. 🫡'
  ];
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- application state (everything a backend would need) ---------- */
  var state = {
    screen: 'invite',
    timeId: null,
    customTime: '',
    activityId: null,
    message: '',
    submitted: false,
    noAttempts: 0
  };
  function find(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function timeLabel() {

    function rel(rect, a) { return { l: rect.left - a.left, t: rect.top - a.top, r: rect.right - a.left, b: rect.bottom - a.top }; }

    };
  }

  // Arrow keys move between the radio-style option cards (standard radiogroup behaviour).
  var arrowNav = false;
  screenEl.addEventListener('keydown', function (e) {
    var dir = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
    if (dir && e.target.getAttribute && e.target.getAttribute('role') === 'radio') {
      var list = Array.prototype.slice.call(e.target.parentNode.querySelectorAll('[role="radio"]'));
      var nxt = list[(list.indexOf(e.target) + dir + list.length) % list.length];
      e.preventDefault();
      arrowNav = true; nxt.focus(); nxt.click(); arrowNav = false;
      return;
    }
    if (e.key === 'Enter' && e.target.id === 'customTime' && state.timeId) { e.preventDefault(); go('activity'); }
  });

  /* ---------- background doodles ---------- */
  (function doodles() {
    var bg = document.getElementById('bg');
    var spec = [
      ['d-star', 5, 11, 30, -8], ['d-cup', 89, 7, 38, 10], ['d-warn', 92, 42, 32, -10], ['d-star', 3, 52, 26, 12],
      ['d-cup', 7, 83, 36, -14], ['d-warn', 85, 88, 30, 8], ['d-star', 48, 2, 22, 0], ['d-star', 94, 68, 24, 14],
      ['d-cup', 2, 30, 30, 6], ['d-star', 68, 95, 24, -12]
    ];
    spec.forEach(function (s, i) {
      var NS = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'doodle');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('width', s[3]);
      svg.setAttribute('height', s[3]);
      svg.style.left = s[1] + '%';
      svg.style.top = s[2] + '%';
      svg.style.setProperty('--r', s[4] + 'deg');
      svg.style.setProperty('--d', 7 + (i % 4) * 1.5 + 's');
      svg.style.setProperty('--dl', -i * 0.9 + 's');
      var use = document.createElementNS(NS, 'use');
      use.setAttribute('href', '#' + s[0]);
      svg.appendChild(use);
      bg.appendChild(svg);
    });
  })();

  go('invite');
})();
</script>
</body>
